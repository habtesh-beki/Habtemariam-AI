services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: personal_ai_agent
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d personal_ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/personal_ai_agent
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  pgdata:
