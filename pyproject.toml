[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-agent"
version = "0.1.0"
description = "Personal research agent for jobs, AI developments, and career opportunities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "google-genai>=1.51",
    "httpx>=0.28",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.6",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
personal-ai-agent = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
